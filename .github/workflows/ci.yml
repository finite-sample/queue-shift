name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@21622c7d616fa4ae611f13e15db49764bae169d1 # v1
    with:
      wheel-import: queue_shift
      python-versions: '["3.11", "3.12", "3.13", "3.14"]'

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Sync environment
        run: uv sync --frozen --all-groups --all-extras
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-latex-extra texlive-bibtex-extra
      - name: Check research artifacts
        run: |
          uv run pytest experiments/tests
          make research-check
