name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@d5000e704aafc69a4834e606bdff81dc8a6d7804 # v1
    with:
      wheel-import: queue_shift

  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Sync environment
        run: uv sync --frozen --all-groups --all-extras
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-latex-extra texlive-bibtex-extra
      - name: Check research artifacts
        run: |
          uv run pytest experiments/tests
          make research-check
