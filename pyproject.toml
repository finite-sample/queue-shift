[project]
name = "queue-shift"
version = "0.1.0"
description = "Update routing classifiers under a queue-movement budget"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "classification",
    "model updates",
    "operations research",
    "queue assignment",
    "staffing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/finite-sample/queue-shift"
Issues = "https://github.com/finite-sample/queue-shift/issues"
Repository = "https://github.com/finite-sample/queue-shift"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "queue_shift"

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pypdf>=5",
    "pyright>=1.1.390",
    "ruff>=0.16.1",
    { include-group = "test" },
]
test = [
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"experiments/**" = ["T201"]
"experiments/analyze_*.py" = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\\.venv|tests|experiments'

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
